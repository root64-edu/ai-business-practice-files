version: 0.7.0
kind: app
app:
  name: 교재_심화입문_단위와계산
  description: 교재용 학습 흐름. 실제 결제·장부 반영 없음.
  mode: workflow
  icon: 📘
  icon_type: emoji
  icon_background: '#D5F5F6'
  use_icon_as_answer_icon: false
dependencies: []
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    nodes:
    - id: start
      type: custom
      position:
        x: 80
        y: 200
      positionAbsolute:
        x: 80
        y: 200
      width: 242
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        type: start
        title: 거래 조건 입력
        desc: ''
        selected: false
        variables:
        - variable: quantity
          label: 수량
          type: number
          required: true
          max_length: 48
          options: []
        - variable: unit_price
          label: 외화 단가
          type: number
          required: true
          max_length: 48
          options: []
        - variable: rate
          label: 원화 환율
          type: number
          required: true
          max_length: 48
          options: []
        - variable: rate_unit
          label: 환율 표시 단위
          type: number
          required: true
          max_length: 48
          options: []
    - id: calculate
      type: custom
      position:
        x: 400
        y: 200
      positionAbsolute:
        x: 400
        y: 200
      width: 242
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        type: code
        title: 단위 확인과 금액 계산
        desc: ''
        selected: false
        code_language: python3
        code: "from decimal import Decimal, ROUND_HALF_UP\n\ndef main(quantity: float,\
          \ unit_price: float, rate: float, rate_unit: float) -> dict:\n    q, p,\
          \ r, u = [Decimal(str(v)) for v in (quantity, unit_price, rate, rate_unit)]\n\
          \    if q <= 0 or q != q.to_integral_value() or p < 0 or r <= 0 or u <=\
          \ 0:\n        return {\"status\": \"확인 필요\", \"report\": \"수량은 양의 정수, 단가는\
          \ 0 이상, 환율과 표시 단위는 양수여야 합니다.\"}\n    foreign = q * p\n    krw = (foreign\
          \ / u * r).quantize(Decimal(\"1\"), rounding=ROUND_HALF_UP)\n    return\
          \ {\"status\": \"계산 완료\", \"report\": f\"외화 상품 대금: {foreign}\\n원화 상품 대금:\
          \ {krw}원\\n계산: {q} × {p} ÷ {u} × {r}\\n원 단위 반올림. 운임·수수료·세금은 포함하지 않았습니다.\"\
          }\n"
        variables:
        - variable: quantity
          value_selector:
          - start
          - quantity
        - variable: unit_price
          value_selector:
          - start
          - unit_price
        - variable: rate
          value_selector:
          - start
          - rate
        - variable: rate_unit
          value_selector:
          - start
          - rate_unit
        outputs:
          status:
            type: string
            children: null
          report:
            type: string
            children: null
    - id: end
      type: custom
      position:
        x: 720
        y: 200
      positionAbsolute:
        x: 720
        y: 200
      width: 242
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        type: end
        title: 검토 결과
        desc: ''
        selected: false
        outputs:
        - variable: status
          value_selector:
          - calculate
          - status
        - variable: report
          value_selector:
          - calculate
          - report
    edges:
    - id: start-calculate
      type: custom
      source: start
      target: calculate
      sourceHandle: source
      targetHandle: target
      data:
        sourceType: start
        targetType: code
        isInIteration: false
        isInLoop: false
    - id: calculate-end
      type: custom
      source: calculate
      target: end
      sourceHandle: source
      targetHandle: target
      data:
        sourceType: code
        targetType: end
        isInIteration: false
        isInLoop: false
    viewport:
      x: 0
      y: 0
      zoom: 0.8
