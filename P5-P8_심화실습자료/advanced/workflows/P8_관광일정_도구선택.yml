version: 0.7.0
kind: app
app:
  name: 교재_P8_관광일정_도구선택
  description: 교재용 학습 흐름. 실제 결제·장부 반영 없음.
  mode: workflow
  icon: 📘
  icon_type: emoji
  icon_background: '#D5F5F6'
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/openai:1.1.0@95f7de6ee42124cb7649f20d3f175c5b0adb66ad92640a97e4027c15b266141c
    version: null
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    nodes:
    - id: start
      type: custom
      position:
        x: 40
        y: 200
      positionAbsolute:
        x: 40
        y: 200
      width: 242
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        type: start
        title: 요청과 저장 경로 자료
        desc: ''
        selected: false
        variables:
        - variable: request
          label: 여행 기획 요청
          type: paragraph
          required: true
          max_length: 100000
          options: []
        - variable: data_json
